server:
  address: 0.0.0.0
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        max-age: -1

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: "${GITHUB_CLIENT_ID}"
            client-secret: "${GITHUB_CLIENT_SECRET}"
            scope: read:user

  datasource:
   url: jdbc:postgresql://localhost:5432/thesis
   username: thesis_user
   password: 12345
  flyway:
   enabled: true
   locations: classpath:db/migration
  servlet:
    multipart:
     max-file-size: 10MB
     max-request-size: 10MB
app:
  admin-id: "${ADMIN_GITHUB_ID}"
  upload-verzeichnis: "uploads"