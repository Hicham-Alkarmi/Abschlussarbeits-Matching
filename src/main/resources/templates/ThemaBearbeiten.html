<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thema bearbeiten</title>
</head>
<body>
<main>
  <h1>Thema bearbeiten</h1>

  <p th:if="${fehler}" th:text="${fehler}" role="alert"></p>

  <form th:action="@{'/betreuer/thema-bearbeiten/' + ${themaId}}"
        method="post"
        th:object="${themaDto}">

    <input type="hidden" th:field="*{betreuerId}">

    <label for="titel">Titel *</label>
    <input id="titel" type="text" th:field="*{titel}"
           aria-required="true">
    <br>

    <label for="beschreibung">Beschreibung</label>
    <textarea id="beschreibung"
              th:field="*{beschreibung}"></textarea>
    <br>

    <label for="fachgebiete">
      Fachgebiete (kommagetrennt: informatik, mathe)
    </label>
    <input id="fachgebiete" type="text"
           th:field="*{fachgebiete}">
    <br>

    <label for="veranstaltungen">
      Veranstaltungen (kommagetrennt: AD, RDB)
    </label>
    <input id="veranstaltungen" type="text"
           th:field="*{empfohleneVeranstaltungen}">
    <br>

    <label for="linkUri">
      Link URLs (kommagetrennt)
    </label>
    <input id="linkUri" type="text" th:field="*{linkUri}">
    <br>

    <label for="linkText">
      Link Texte (kommagetrennt)
    </label>
    <input id="linkText" type="text" th:field="*{linkText}">
    <br>

    <button type="submit">Speichern</button>
  </form>

  <a th:href="@{/betreuer/alle-themen}">Zurück</a>
</main>
</body>
</html>
